name: CI

on:
  push:
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_AI_API_URL: http://localhost:3000/api/ai
          VITE_SUPABASE_URL: http://localhost
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder
          VITE_AGORA_APP_ID: placeholder
          VITE_TOKEN_SERVER_URL: http://localhost:3000
        run: npm run build
